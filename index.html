<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Test</title>
<link rel="stylesheet" href="style.css">
</head><body>
<section id="login" class="card screen"><h1>Student Test Portal</h1>
  <label for="reg">Registration number</label>
  <input id="reg" autocomplete="off" autofocus>
  <button id="loginBtn">Log in</button><p id="loginErr" class="err" role="alert"></p></section>

<section id="intro" class="card screen" hidden><h1 id="hello"></h1>
  <ul><li>100 multiple-choice questions, <b>60 minutes</b>.</li>
  <li>The timer runs on the server and continues even if you refresh or close the page.</li>
  <li>Answers save automatically. The test freezes and submits itself when time ends.</li>
  <li>You can attempt the test only once.</li></ul>
  <button id="startBtn">Start test</button></section>

<section id="test" class="screen" hidden>
  <header><span id="prog"></span><span id="timer" aria-live="off">60:00</span><button id="submitBtn">Submit</button></header>
  <main><div class="card"><h2 id="qtext"></h2><div id="opts" role="radiogroup"></div>
    <div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></div>
    <aside id="palette" aria-label="Question navigator"></aside></main>
</section>

<section id="done" class="card screen" hidden><h1>Test submitted</h1><p id="result"></p></section>

<div id="modal" hidden><div class="card"><h2 id="mTitle"></h2><p id="mBody"></p></div></div>
<script src="app.js"></script></body></html>
